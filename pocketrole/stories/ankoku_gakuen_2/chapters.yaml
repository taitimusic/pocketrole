# chapters.yaml — 逢魔ヶ刻学園コミカル再設計版
# 「余興無茶振りシリーズ」構造
# ch1_invasion は自動起動。余興章は manual で追加可能。卒業まで続く。

chapters:
  # ─── 固定章1「乗り込んできた経営陣」────────────────────────────────────────
  - id: "ch1_invasion"
    title: "第一章「乗り込んできた経営陣」"
    theme: "対立と混乱 — 廃校通告から始まる悲喜劇。素人集団がサーカスに売られた日"
    world_injection: >
      私立逢魔ヶ刻学園に、外部の新理事会が乗り込んできた。
      東上重盛理事長からの「最終通告書」が全生徒に配布された。全文2,134字。
      要点は最後の3行だけだった。「廃校する」と書いてあった。
      数日後、焼坂財務本部長から別の封書が届いた。関西弁・簡潔・一行目から取り立てモード。
      「トージョー大サーカスの余興を手伝え。30日後の公演に間に合わせや。それやれば学校閉鎖は勘弁したる」。
      こうして音楽経験ほぼゼロの7人が、廃校を回避するために動き始めた。
    start_condition: "turn >= 0"
    beats:
      - phase: "setup"
        description: "廃校通告書が配布される。東上理事長の2,134字文書と霊夢の「出席日数どうなるの」発言"
        goal: "廃校という現実と生徒たちの混乱が伝わる"
        events:
          - type: "final_notice"
            flavor: "conflict"
            desc: "東上重盛理事長の最終通告書が全生徒に届いた。全文2,134字。要点は最後の3行「廃校する」だけだった。"
          - type: "reimu_reaction"
            flavor: "relationship"
            desc: "霊夢が言った。「ちょっと待って。このまま休校扱いになったら出席日数どうなるの。どうすんのよ」。これが全ての発端だった。"

      - phase: "complication"
        description: "生徒7人の混乱。音楽経験ゼロの現実と「どうする？」の堂々巡り"
        goal: "素人集団の現実と「サーカスの余興」という次のフラグへの橋渡し"
        events:
          - type: "skill_check"
            flavor: "revelation"
            desc: "「音楽できる人？」という問いに、手を上げたのはルナだけだった。「ピアノ……は弾けますけど」。全員が沈黙した。"
          - type: "marisa_solution"
            flavor: "mystery"
            desc: "マリサが廊下のホースを持参してきた。「これで音出せるぜ！」。吹いたら水が出た。霊夢「それは違うわ」。"

      - phase: "turning_point"
        description: "焼坂組長の封書「サーカスの余興をやれ」。霊夢「人さらいが……」"
        goal: "「廃校か余興か」という2択が確定し、全員が動き出すきっかけになる"
        events:
          - type: "circus_order"
            flavor: "conflict"
            desc: "焼坂財務本部長から封書が届いた。「トージョー大サーカスの余興を手伝え。音楽の演奏も含まれとる。30日後の公演に間に合わせや。それやれば、学校閉鎖は勘弁したる。——焼坂」"
          - type: "reimu_comment"
            flavor: "relationship"
            desc: "霊夢が静かに言った。「人さらいが来てサーカス団に売られるなんて昭和のおとぎ話かと思ってたけど本当にあるのね」。"

      - phase: "resolution"
        description: "「こんな素人がどうする！？」で全員が動き出す。30日間のカウントダウン開始"
        goal: "悲喜劇的な覚悟が固まり、次章（ch_circus_music）へ向かう"
        events:
          - type: "team_formed"
            flavor: "relationship"
            desc: "ユウマが言った。「俺に考えがある」。全員が期待した。「……えーとですね。やってみればわかるやつです」。ソーマ「七割間違ってるが三割正解だ。やれ」。"
          - type: "countdown_start"
            flavor: "conflict"
            desc: "30日のカウントダウンが始まった。マリサ「いける気がするぜ！」。霊夢「何で！？」。ちゅるるん「えぇっ！？あたしも絶対やる！！」。"

  # ─── 余興シリーズ第1弾「音楽演奏をやらされる羽目に」─────────────────────────
  - id: "ch_circus_music"
    title: "「音楽演奏をやらされる羽目に。どうする？編」"
    theme: "挑戦と混乱 — 楽器も弾けないのにサーカスで演奏しなければならない"
    world_injection: >
      30日後のサーカス初公演に向けて、音楽演奏の練習が始まった。
      ルナのピアノ以外は全員素人。マリサは毎日謎の楽器候補を持ち込む。
      ちゅるるんはギターを独学中（まだ3コードしか弾けない）。
      焼坂組長から「進捗はどうや」という確認封書も届いている。
      初公演まであと30日。勝算はほぼゼロに見えるが、ユウマ「俺に考えがある」。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "練習初日の大混乱。マリサのホース、霊夢の神社の鈴、ちゅるるんの3コード"
        goal: "「素人がどうやって演奏するか」という課題と笑いが共存する状態を作る"
        events:
          - type: "first_practice"
            flavor: "mystery"
            desc: "練習初日。マリサが廊下のホースを担いで登場。「これで音出せるぜ！」。水も出た。霊夢「それは違うわ」。ちゅるるん「えぇっ！？あたしもやる！！」。ソーマ「本物の馬鹿だな」。"
          - type: "runa_piano"
            flavor: "relationship"
            desc: "ルナが恐る恐るピアノを弾いた。全員が静かになった。「上手いじゃん……」。ちゅるるん「（心の中）あいつのピアノ……あたしが超えてやる……」。"

      - phase: "complication"
        description: "練習が全然進まない。マリサの謎楽器リストが増えていく。ちゅるるんが猛練習"
        goal: "困難と可能性が同時に見えてくる"
        events:
          - type: "marisa_collection"
            flavor: "mystery"
            desc: "マリサのスケッチブックに謎楽器候補のリストが増えていく。試験管・スプーン・蛇口・体操マットの空気弁……「今日で34点目だぜ！」。霊夢「全部違うわ！！」。"
          - type: "chururun_practice"
            flavor: "relationship"
            desc: "ちゅるるんが一人で猛練習していた。指が痛いのに止まらない。ルナが通りかかって「すごい！頑張ってますね！」と言った。ちゅるるんが固まった。"

      - phase: "turning_point"
        description: "マリサの謎楽器34点目が実はいい音を出す。ユウマ「俺に考えがある（本当にある）」"
        goal: "一発逆転の糸口が見え始める"
        events:
          - type: "marisa_miracle"
            flavor: "revelation"
            desc: "マリサのスケッチブック34点目の謎楽器を実際に試した。……なぜか本当にいい音が出た。全員が固まった。マリサ「全部解決だな！」。霊夢「この一点だけは認めるわ（不服そうに）」。"
          - type: "souma_verdict"
            flavor: "relationship"
            desc: "ソーマが長い沈黙の後に言った。「それで行け。三割正解だ」。ユウマ「俺に考えがある（今回は本当にある）」。全員「珍しい」。"

      - phase: "resolution"
        description: "初公演。結果はどうあれ、全員が全力でやり遂げた"
        goal: "第1弾余興を経験したことで、次の余興課題への素地ができる"
        events:
          - type: "first_performance"
            flavor: "relationship"
            desc: "サーカスの舞台で演奏した。完璧ではなかった。でも全員やり切った。焼坂組長から封書が届いた。「まあ、合格や。次の余興の準備せえよ」。霊夢「またサーカスに売られてるわね」。"

  # ─── 余興シリーズ第2弾「漫才をやらされる羽目に」─────────────────────────────
  - id: "ch_circus_manzai"
    title: "「漫才をやらされる羽目に。どうする？編」"
    theme: "対立と協力 — ボケとツッコミ、誰がどっちをやるかで大揉め"
    world_injection: >
      焼坂組長から新たな封書が届いた。「次の余興は漫才や。ボケとツッコミ、ちゃんと決めといてや」。
      霊夢「またサーカスに売られてるわね」。
      漫才のネタ作りが始まった。だが誰もボケ担当をやりたがらない。
      ソーマが「俺がボケをやれば勝てる」と宣言して全員が固まった。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "ボケ・ツッコミ役の決め方で揉める。ソーマ「俺がボケをやれば勝てる」発言"
        goal: "役割決めの混乱と意外な組み合わせが示唆される"
        events:
          - type: "role_dispute"
            flavor: "conflict"
            desc: "「ボケはあたしがやる！」（ちゅるるん）「いやあたしがやるわ（ミリティア）」「ツッコミなら（霊夢）」。ソーマが静かに言った。「俺がボケをやれば、勝てる」。全員が固まった。"
          - type: "marisa_costume"
            flavor: "mystery"
            desc: "マリサが漫才の準備として謎の変装で登場した。「ボケってこういうことだぜ！」。霊夢「違うわ！！」。"

      - phase: "complication"
        description: "ネタ作りが全然進まない。方向性の対立が起きる"
        goal: "漫才という課題の難しさと各キャラの個性が衝突"
        events:
          - type: "style_conflict"
            flavor: "conflict"
            desc: "ちゅるるんとミリティアがネタの方向性で対立した。ちゅるるん「感情系でいく！」、ミリティア「バズり系でいく！」。ルナ「あの……どちらでも……」。"
          - type: "yuuma_monologue"
            flavor: "relationship"
            desc: "ユウマが屋上で独白を始めた。「クソ……漫才……俺には何ができる……待て……考えろ……（長い）……あ、トイレ行きたい」。"

      - phase: "turning_point"
        description: "意外な組み合わせが成立。ソーマのボケが実は効く"
        goal: "予想外の解決策で全員が一致団結"
        events:
          - type: "souma_boke"
            flavor: "revelation"
            desc: "ソーマが真顔でボケをやった。誰も笑えなかった。怖いくらい面白かった。ユウマ「これ……いける気がします」。ソーマ「当然だ」。"
          - type: "team_order"
            flavor: "relationship"
            desc: "組み合わせが決まった。ソーマ（ボケ）× ルナ（ツッコミ）。ちゅるるん「なんでルナとソーマが組むの！？」（悔しそう）。"

      - phase: "resolution"
        description: "漫才公演本番。全員の見せ場がある"
        goal: "漫才を通じて関係性に変化が生まれる"
        events:
          - type: "manzai_performance"
            flavor: "relationship"
            desc: "サーカスの漫才公演が終わった。ソーマの怖いほど真顔のボケが受けた。焼坂組長「……まあ合格や。次の余興やで」。霊夢「またサーカスに売られてるわね（3回目）」。"

  # ─── 余興シリーズ第3弾「マジックショーをやらされる羽目に」──────────────────
  - id: "ch_circus_magic"
    title: "「マジックショーをやらされる羽目に。どうする？編」"
    theme: "秘密と発見 — ソーマが手品の本を3冊持っていたことが判明する"
    world_injection: >
      焼坂組長から「今度はマジックや」という封書が届いた。
      全員が途方に暮れていた。するとソーマが珍しく積極的になった。
      「……まあ。最悪の手ではない」（いつもより嬉しそうに）。
      後から地下倉庫で手品の本が3冊見つかった。全員「え？」。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "マジック課題の発表。ソーマが珍しく積極的になる"
        goal: "ソーマの秘密への伏線と、全員の役割分担の混乱"
        events:
          - type: "magic_order"
            flavor: "conflict"
            desc: "焼坂組長の封書「今度はマジックや」。全員が沈黙した。ソーマだけが「……最悪の手ではない」と言った。珍しく口元が動いていた気がした。"
          - type: "marisa_ready"
            flavor: "mystery"
            desc: "マリサが手品の本を全文暗記してきた。「タネも仕掛けも関係ないだぜ！」。霊夢「それが一番タネが大事なのよ！！」。"

      - phase: "complication"
        description: "タネが全部バレる。ソーマの手品本が発見される"
        goal: "ソーマの意外な一面と、練習の混乱が共存"
        events:
          - type: "souma_secret"
            flavor: "revelation"
            desc: "地下倉庫でソーマの手品本が3冊見つかった。表紙は日焼けして古かった。「……幼い頃に購入した。それだけだ」。ユウマ「ソーマさん、もしかして好きなんですか？」。ソーマ「（沈黙）……次の練習をしろ」。"
          - type: "marisa_trick_fail"
            flavor: "mystery"
            desc: "マリサがトランプを使ったマジックを披露した。タネが見えた。霊夢「それ布が透けてるわよ！！」。マリサ「いける気がするぜ！」。"

      - phase: "turning_point"
        description: "ソーマが本気を出す。誰も見たことのない真剣な顔"
        goal: "ソーマのツンデレが崩れる瞬間"
        events:
          - type: "souma_serious"
            flavor: "relationship"
            desc: "ソーマが黙って手品を始めた。誰も気づかないうちにルナのリボンが消えていた。全員が固まった。ソーマ「……それだけだ（本を読み始める）」。"
          - type: "chururun_reaction"
            flavor: "relationship"
            desc: "ちゅるるんが大声で叫んだ。「えぇっ！！すごい！！ソーマって実は天才！？」。ソーマ「その言葉は貴様には返せない（ちゅるるんに向けて）」。"

      - phase: "resolution"
        description: "マジック公演成功。ソーマが一番目立ってしまった"
        goal: "意外なヒーロー誕生と、次課題への布石"
        events:
          - type: "magic_performance"
            flavor: "relationship"
            desc: "マジック公演でソーマが一番受けた。当人は「……予定外だ（本を持って立ち去る）」。ちゅるるん「ずるい！なんでソーマだけ！！」。焼坂組長「まあ合格や」。霊夢「またサーカスに……（4回目）」。"

  # ─── 余興シリーズ第4弾「お正月特別公演をやらされる羽目に」─────────────────
  - id: "ch_circus_newyear"
    title: "「お正月特別公演（漫才）をやらされる羽目に。どうする？編」"
    theme: "混乱と連帯 — お正月ネタ漫才でマリサの謎変装が最高潮に達する"
    world_injection: >
      年末年始の特別公演通知が届いた。「お正月向けの漫才で頼むわ。——焼坂」。
      マリサが「正月の変装ネタ考えたぜ！」と謎の変装で登場した。
      ルナが「龍笛で神楽を入れたらどうですか？」と提案して全員が凍りついた。
      霊夢「また昭和のおとぎ話が続いてるわね（5回目）」。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "お正月ネタの収集。マリサの謎変装シリーズ最高潮"
        goal: "お正月という文化ネタとキャラの個性が衝突する笑い"
        events:
          - type: "newyear_concept"
            flavor: "mystery"
            desc: "「お正月ネタを考えよう」という会議が始まった。マリサが謎の変装（鏡餅の被り物）で登場した。「これでいくぜ！」。霊夢「全然ダメよ！！」。ちゅるるん「えぇっ！？なにそれかわいい！！（心の声）」。"
          - type: "runa_gagaku"
            flavor: "mystery"
            desc: "ルナが「龍笛で雅楽を入れたらどうですか？お正月っぽくて」と提案した。全員が沈黙した。ソーマ「……それで行け。三割正解だ（珍しく2割多め）」。"

      - phase: "complication"
        description: "お正月ネタが迷走する。全員の「お正月観」が全然違う"
        goal: "個性の衝突が最高潮になりつつ、何かが噛み合い始める"
        events:
          - type: "style_clash"
            flavor: "conflict"
            desc: "ミリティア「初詣バズりネタでいく！」、ちゅるるん「元旦は感情系！！」、マリサ「鏡餅の変装で全部解決だぜ！」、ルナ「あの……龍笛の件は……」。ユウマ「クソ……なんでこうなる……待て……（長い独白）……あ、あけましておめでとうございます（場違い）」。"
          - type: "souma_plan"
            flavor: "relationship"
            desc: "ソーマが全員を静かに見ていた。「全部使え」。「え？」。「マリサの変装、ルナの龍笛、ミリティアの告知、ちゅるるんの感情。全部使え。七割は間違ってるが三割は正解だ」。"

      - phase: "turning_point"
        description: "全員の個性がかみ合う奇跡の瞬間"
        goal: "バラバラだった要素がひとつになる"
        events:
          - type: "miracle_rehearsal"
            flavor: "relationship"
            desc: "通しリハーサルで、なぜかうまくいった。マリサの変装ボケ、ルナの龍笛、ちゅるるんの感情、ミリティアのSNS告知、ソーマの真顔ボケ、ユウマのトンチンカン合いの手。全部噛み合った。霊夢「……まあ、悪くないわね（珍しく褒める）」。"

      - phase: "resolution"
        description: "お正月公演成功。「昭和のおとぎ話」が続く"
        goal: "また新たな余興課題が待っているという予感と、全員の絆"
        events:
          - type: "newyear_performance"
            flavor: "relationship"
            desc: "お正月公演が終わった。焼坂組長「……ええな。また来月も来てもらうで」。全員「え、まだ続くの！？」。霊夢「昭和のおとぎ話が延々続いてるわね（6回目）」。"

  # ─── 余興シリーズ第5弾「空中ブランコをやらされる羽目に」──────────────────
  - id: "ch_circus_acrobat"
    title: "「空中ブランコをやらされる羽目に（音楽担当なのに）。どうする？編」"
    theme: "混乱と限界突破 — 音楽担当がなぜかアクロバットをやらされる"
    world_injection: >
      焼坂組長から「次はサーカスっぽいことをやってもらおうか。空中ブランコや」という封書。
      全員「え？」。「音楽担当じゃなかったの？」。
      ちゅるるん「天才だから余裕でしょ！（余裕ではない）」。
      ユウマ「クソ……なんでこうなる……待て……俺に考えがある……（3秒後）落ちたらマットで受け止めればいい」。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "空中ブランコという想定外の課題。全員パニック"
        goal: "「音楽と全然関係ない」という理不尽さとパニックの笑い"
        events:
          - type: "acrobat_order"
            flavor: "conflict"
            desc: "焼坂組長の封書「空中ブランコや」。全員が黙り込んだ。ちゅるるん「天才だから余裕でしょ！（全然余裕ではない）」。ルナ「あの……私ピアノは弾けますけど……空中は……」。"
          - type: "yuuma_plan"
            flavor: "mystery"
            desc: "ユウマが独白の後に言った。「俺に考えがある。落ちたらマットで受け止めればいい」。ソーマ「それは計画じゃない（でも三割正解だ）」。"

      - phase: "complication"
        description: "練習が始まる。落ちる・怖い・ぎゃーという状況の連続"
        goal: "困難の中に笑いと絆が生まれる"
        events:
          - type: "practice_chaos"
            flavor: "conflict"
            desc: "初練習。ちゅるるんが「天才だから一発でできる！」と挑んで落ちた。「えぇっ！？なんで！？」。マリサ「マットの音、いい音するぜ（スケッチブックにメモ）」。霊夢「違うわよ！！」。"
          - type: "chururun_struggle"
            flavor: "relationship"
            desc: "ちゅるるんが悔しくて何度も挑戦していた。ルナが「大丈夫？頑張ってますね」と声をかけた。ちゅるるんが固まった。「べ、別に……（0.1秒後）ありがとう！！」。"

      - phase: "turning_point"
        description: "意外な解決策。「音楽をやりながらブランコに乗る」という形式に"
        goal: "得意分野と苦手分野の融合"
        events:
          - type: "fusion_idea"
            flavor: "revelation"
            desc: "ソーマが言った。「空中で音楽をやれ。ブランコの上で演奏する。それが一番まともな解だ（七割間違ってるが三割正解）」。ルナ「……ピアノは無理ですが、龍笛なら……」。ちゅるるん「えぇっ！！すごい！！あたしもギター持って乗る！！」。"

      - phase: "resolution"
        description: "空中ブランコ公演（変形版）。誰も想像しなかった余興"
        goal: "「音楽担当なのにアクロバット」の決着と次への布石"
        events:
          - type: "acrobat_performance"
            flavor: "relationship"
            desc: "空中ブランコの上でルナが龍笛を吹き、ちゅるるんがギターを弾いた。観客は困惑した。焼坂組長「……ま、まあ合格や（珍しく声がぶれた）」。霊夢「またサーカスに売られてるわね（7回目）」。"

  # ─── 外伝「ユウマの勝算」────────────────────────────────────────────────────
  - id: "side_yuuma_gamble"
    title: "外伝「ユウマの勝算」"
    theme: "独白と決断 — 夜風ユウマの一人舞台。クソ……から始まる名言集"
    world_injection: >
      夜の屋上に、夜風ユウマが一人でいた。
      「クソ……なんでこうなる……待て、考えろ……しかし……俺は……」
      長い独白が始まった。
      ソーマが通りかかった。聞いていたかどうか分からない。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "ユウマが一人で屋上に来て独白を始める"
        goal: "ユウマの内面と（笑える）葛藤が明らかになる"
        events:
          - type: "yuuma_alone"
            flavor: "relationship"
            desc: "夜の屋上にユウマが一人でいた。独白が始まった。「クソ……こんな状況……俺に何ができる……待て……考えろ……しかし……俺は……（1分後）……あ、トイレ行きたかった」。"

      - phase: "complication"
        description: "独白が核心に近づいてくる。ユウマが何かを決めようとしている"
        goal: "ユウマの意外な核心が見える"
        events:
          - type: "yuuma_core"
            flavor: "revelation"
            desc: "「俺は……学校がなくなってほしくないんだ。みんなと一緒にいたい。バカな理由だけど……そういうことだ（珍しく素直な独白）」。"

      - phase: "turning_point"
        description: "ソーマが現れる。「七割間違ってるが三割正解だ。やれ」"
        goal: "ユウマとソーマの関係性の進展"
        events:
          - type: "souma_arrives"
            flavor: "relationship"
            desc: "ソーマが屋上にいた。いつからいたかは分からない。「七割間違ってるが、三割は正解だ。やれ」。ユウマ「聞いてたんですか！？」。ソーマ「（本を読み始める）」。"

      - phase: "resolution"
        description: "ユウマが「俺に考えがある（今度は本当）」と言う"
        goal: "外伝の締め。関係性の変化が一歩進む"
        events:
          - type: "yuuma_decision"
            flavor: "relationship"
            desc: "ユウマが言った。「俺に考えがあります（今度は本当にある）」。ソーマが珍しく顔を上げた。「……聞かんと言ったが、聞いてもいい」。ユウマ「えっ（嬉しい）」。"

  # ─── 外伝「ソーマがここにいる理由」──────────────────────────────────────────
  - id: "side_souma_past"
    title: "外伝「ソーマがここにいる理由」"
    theme: "秘密と皮肉 — なぜ銀次型の男がこの学校にいるのかの断片"
    world_injection: >
      地下倉庫で、ソーマが一人で古い手品の本を読んでいた。
      誰かが入ってきた。
      「ソーマって昔なにかやってたの？」という問いに、
      ソーマは本を閉じた。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "地下倉庫でソーマが手品本を読んでいる場面"
        goal: "ソーマの秘密への入口"
        events:
          - type: "souma_alone"
            flavor: "mystery"
            desc: "地下倉庫でソーマが古い手品の本を読んでいた。表紙は子供向けだった。「……何も言うな（誰かが入ってきた気配に）」。"

      - phase: "complication"
        description: "誰かがソーマに「昔何かやってた？」と問う"
        goal: "ソーマの過去の断片が見える"
        events:
          - type: "past_question"
            flavor: "revelation"
            desc: "「ソーマって昔なにかやってたの？」という問いに、ソーマは少し沈黙した。「……マジックショーを見た。昔。それだけだ」。「好きなの？」。「……関係ない（本を開く）」。"

      - phase: "turning_point"
        description: "「なぜここにいるのか」の核心に少し近づく"
        goal: "ソーマが何かを守ろうとしていることが見える"
        events:
          - type: "souma_reason"
            flavor: "revelation"
            desc: "長い沈黙の後、ソーマが言った。「……居場所があるなら、使え。それだけだ」。それ以上は言わなかった。"

      - phase: "resolution"
        description: "ソーマが皮肉に戻る。でも少し変わった"
        goal: "外伝の締め。ツンデレの核心が少しだけ見えた"
        events:
          - type: "souma_return"
            flavor: "relationship"
            desc: "ソーマが立ち上がって言った。「練習に戻れ。七割は間違ってるかもしれないが、やってみないとわからない」。それだけ言って倉庫を出た。本はそのまま棚に戻した。"

  # ─── 外伝「魔理沙のコレクション展覧会」─────────────────────────────────────
  - id: "side_marisa_collection"
    title: "外伝「魔理沙のコレクション展覧会」"
    theme: "発見と笑い — 謎楽器候補34点の全貌が明らかになる。1点だけ本物がある"
    world_injection: >
      マリサが全員を集めた。
      「大発表だぜ！謎楽器候補の展覧会を開くぜ！」。
      霊夢「いらないわよ！！」。
      でも全員来てしまった。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "マリサの展覧会が始まる。1〜10点目の展示"
        goal: "マリサの発想と霊夢のツッコミのテンポが確立"
        events:
          - type: "exhibition_start"
            flavor: "mystery"
            desc: "マリサが1〜10点目を次々に発表した。蛇口、ホース、試験管、スプーン、眼鏡ケース……。霊夢が10回連続で「それは違うわ！」と言った。チュルルン「えぇっ！？なにこれ！？全部見せて！！」。"

      - phase: "complication"
        description: "11〜30点目。どんどんエスカレートしていく"
        goal: "発想の飛躍と全員のツッコミの疲弊"
        events:
          - type: "exhibition_middle"
            flavor: "mystery"
            desc: "11〜30点目が続いた。校長の椅子の軋み音、体育倉庫のビブスの振動音、プールの水面の反響音……ルナ「あの……これはちょっと……」。ソーマ「……（本を読んでいたが少し聞いている）」。"

      - phase: "turning_point"
        description: "31〜34点目。最後の一点で全員が静まり返る"
        goal: "34点目だけ本当にいい音が出る奇跡の瞬間"
        events:
          - type: "miracle_sound"
            flavor: "revelation"
            desc: "34点目が登場した。誰も知らないガラクタ置き場の奥にあった何かだった。マリサが鳴らした。……なぜか本当にいい音が出た。全員が静かになった。「これ……使えるぜ」。ソーマ「……三割どころか、全部正解だ（珍しく言った）」。"

      - phase: "resolution"
        description: "34点目がサーカス本番で活きる。マリサの名誉回復"
        goal: "笑いと感動が共存するギャグ回の締め"
        events:
          - type: "marisa_glory"
            flavor: "relationship"
            desc: "霊夢が渋々認めた。「……この一点だけは認めるわ」。マリサ「全部解決だな！（35点目のメモを書き始める）」。霊夢「まだやるの！！」。"

  # ─── 固定章「ついに卒業の日」────────────────────────────────────────────────
  - id: "ch_graduation"
    title: "最終章「ついに卒業の日」"
    theme: "解放と継続 — 学校閉鎖されずに無事卒業。でも終わりは終わりじゃない"
    world_injection: >
      卒業式の日が来た。
      学校は閉鎖されなかった。廃校にはならなかった。
      全員がここにいる。
      焼坂組長からの最後の封書が届いた。
      「また来年も来てくれや」と書いてあった。
    start_condition: "manual"
    beats:
      - phase: "setup"
        description: "卒業式当日。誰もが信じられない思いで式場に立っている"
        goal: "無事に卒業の日を迎えた感動と安堵"
        events:
          - type: "graduation_day"
            flavor: "relationship"
            desc: "卒業式が始まった。霊夢が静かに言った。「……あの日わたしが「出席日数どうなるの」って言わなかったら、こうなってたかな」。マリサ「全部解決だな！（35点目を仕上げながら）」。"

      - phase: "complication"
        description: "最後の焼坂組長の封書が届く"
        goal: "「終わり」と思ったら「続く」という展開への示唆"
        events:
          - type: "last_letter"
            flavor: "mystery"
            desc: "卒業式の最中に焼坂組長からの封書が届いた。「また来年も来てくれや。後輩達もよろしく。——焼坂」。全員「え、まだ続くの！？」。霊夢「昭和のおとぎ話は終わらないのね（最終回）」。"

      - phase: "turning_point"
        description: "全員が何かを振り返る"
        goal: "旅の中で変化したことへの気づき"
        events:
          - type: "looking_back"
            flavor: "relationship"
            desc: "ちゅるるんがルナに言った。「……ルナ。あたし、ちゃんと弾けるようになったよ」。ルナが笑った。「知ってます。ずっと見てました」。ちゅるるん「（固まる）……うるさい！！（大声で）ありがとう！！」。"

      - phase: "resolution"
        description: "グッドエンド。後日談へのドアが開く"
        goal: "「終わり」でも「続き」でもある、アメドラ型の締め"
        events:
          - type: "good_end"
            flavor: "relationship"
            desc: "卒業式が終わった。全員がそれぞれの場所に帰っていく。でもトージョー大サーカスとの縁は続く。ユウマが言った。「俺に考えがある（次のシーズンのことについて）」。ソーマ「……聞こうか」。"
