story:
  id: ankoku_gakuen_2
  story_mode: comedy
  title: 逢魔ヶ刻学園 — トージョー大サーカスへようこそ カスタム
  description: 私立逢魔ヶ刻学園、経営難で廃校の危機。乗り込んできた新理事会が生徒に突きつけた条件は「トージョー大サーカスの余興を手伝え」。音楽経験ほぼゼロの7人が、廃校回避のために笑えない悲喜劇に挑む
  season_start: '2026-04-09'
  turn_minutes: 30
  turn_interval_sec: 45
  world_rules: 'ここは私立逢魔ヶ刻学園。慢性的な経営難の末、外部の新理事会が運営権を掌握した。

    生徒には「最終通告書」が届いた。東上重盛理事長の名前で、全文2,134字。要点は最後の3行だけだった。「廃校する」と書いてあった。

    数日後、焼坂財務本部長から別の封書が届いた。「トージョー大サーカスの余興を手伝え。30日後の公演に間に合わせや。それやれば、学校閉鎖は勘弁したる」。

    こうして7人の素人集団が、廃校を回避するためにサーカスの余興に挑むことになった。

    音楽経験があるのは星風ルナだけ（ピアノのみ）。あとは全員素人。カラオケ好きのミリティアと、謎の楽器を持ち込むゆっくり魔理沙がいる。

    焼坂組長からは毎月新たな余興課題が届く。音楽だけでなく、漫才・マジック・大道芸まで何でもあり。卒業するまで余興は続く。

    東上理事長の哲学文書（毎回2,000字超）と焼坂組長の取り立て封書（関西弁・簡潔）が定期的に届く。

    「学校なくなったら……どうするの」という不安と「こんな素人がどうするの」という笑いが同時に存在する。'
places:
- id: classroom
  label: 教室
  zone: school
  atmosphere: 日常と不安が混ざる。授業中でも、サーカス課題のことが頭から離れない
  who_gathers: 授業時間中は全員
  events_likely:
  - 授業中の居眠りとサーカス対策メモ
  - 小テストと「漫才のネタどうしよう」の心配
  - 焼坂組長の新しい封書が回ってくる
  - ミリティアがこっそりSNS告知の文面を考えている
  access_note: 授業時間中は基本ここ。移動は廊下経由
  adjacent_places:
    corridor: 1
- id: rooftop
  label: 屋上
  zone: school
  atmosphere: 風が強く、密談・独白・一人の時間に使われる。夜風ユウマがここで長い独白をする
  who_gathers: ユウマ、ルナ、ソーマ。一人で来ることが多い
  events_likely:
  - ユウマの長い独白（オチがトンチンカン）
  - ちゅるるんがルナにライバル宣言する
  - ソーマが本を読みながら全員を観察している
  - ミリティアがサーカス公演の告知文を考えている
  access_note: 授業中は立入禁止だが鍵がかかっていないことも多い
  adjacent_places:
    corridor: 2
