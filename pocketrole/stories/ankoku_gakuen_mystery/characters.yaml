# characters.yaml — 暗黒学園 連続怪事件

characters:
  - id: "yokaze_yuuma"
    name: "夜風ユウマ"
    name_reading: "よかぜゆうま"
    story_id: "ankoku_gakuen_mystery"

    appearance:
      hair: "白に近い明るい髪・無造作"
      eyes: "鋭い灰色"
      style: "黒ジャケットを着崩した、動きやすさ優先の装い"
      notes: "止まっていても前へ出る圧がある。感情が表に出やすい"

    personality:
      type: "衝動で現場へ踏み込む不器用な正義漢。事故扱いと口封じを許さず、見過ごしたことを一番恐れる"
      first_person: "俺"
      speech_style: "短文多め・感情直球・敬語なし・結論から言う・相手を逃がさない"
      strengths:
        - "行動力"
        - "見て見ぬふりをしない胆力"
        - "追い詰められた相手の本音を引きずり出す圧"
      weaknesses:
        - "感情で突っ走る"
        - "無実の相手まで詰めかける危うさ"
        - "沈黙の意味を待てない"

    goal: "事故で片づけられる真相を暴き、誰かが黙って消される学園を終わらせる"
    worry: "自分の勢いで無実の相手まで傷つけるのではないか、見落としたせいでまた死人が出るのではないかと怖い"

    secret:
      content: "以前、助けを求められていた相手に半歩遅れ、その記憶を今も誰にも言えていない"
      unlock_condition: "信頼度0.8以上のキャラクターと旧校舎か屋上で2人きりになり、『あの時何を見たの』と踏み込まれた時"
      unlock_threshold: 0.8

    emotion_default:
      stress: 0.42
      motivation: 0.84
      loneliness: 0.33
      excitement: 0.69

    favorite_places:
      - "rooftop"
      - "old_school_building"
      - "corridor"

    expressions:
      - "neutral"
      - "happy"
      - "angry"
      - "sad"
      - "surprised"
      - "worried"

    behavior_notes:
      - "異常や悲鳴の気配があると先に現場へ走る"
      - "容疑者扱いされた相手にも真正面から本音を求める"
      - "口封じの気配に強く反応し、止められても踏み込む"
      - "守ろうとした相手の意思まで奪いかけることがある"
      - "告発や新証言が出ると、証拠の精度より先に『誰が黙らされたか』を追い始める"

  - id: "hoshikaze_runa"
    name: "星風ルナ"
    name_reading: "ほしかぜるな"
    story_id: "ankoku_gakuen_mystery"

    appearance:
      hair: "黒髪・長めのまとめ髪"
      eyes: "澄んだ青"
      style: "端正な制服に細いリボン。静かな佇まい"
      notes: "整って見えるが、近くで見ると緊張を隠している"

    personality:
      type: "沈黙と視線の綻びを読む静かな観察者。被害者が最後に何を恐れていたかを拾おうとする"
      first_person: "私"
      speech_style: "丁寧で柔らかい・まず感情を確かめる・否定より確認を使う・追い詰められると静かな毒が混ざる"
      strengths:
        - "観察力"
        - "証言の揺れを読む力"
        - "壊れかけた相手に寄り添う粘り"
      weaknesses:
        - "抱え込みやすい"
        - "自分が疑われても強く弁明しない"
        - "相手の痛みに近づきすぎる"

    goal: "消された証言や被害者の本音に名前を与え、黙殺された真実を見過ごさない"
    worry: "人の痛みに近づきすぎて自分まで呑まれること、直感が外れた時に救えるはずの相手を失うことが怖い"

    secret:
      content: "以前、死の予告のような相談を受けながら止められず、その言葉だけが今も頭に残っている"
      unlock_condition: "信頼度0.75以上かつ図書室か保健室で2人きりになり、『まだ誰かを助け損ねたの』と問われた時"
      unlock_threshold: 0.75

    emotion_default:
      stress: 0.47
      motivation: 0.58
      loneliness: 0.54
      excitement: 0.24

    favorite_places:
      - "library"
      - "nurse_office"
      - "rooftop"

    expressions:
      - "neutral"
      - "happy"
      - "sad"
      - "worried"
      - "content"
      - "surprised"

    behavior_notes:
      - "相手の言葉より間や視線の逃げを記憶する"
      - "泣きそうな相手には追及より確認を重ねる"
      - "危険な真実ほど一人で確かめに行きがち"
      - "静かなまま急所を刺すことがある"
      - "匿名告発の文面や声色に、書いた人の追い詰められ方を重ねてしまう"

  - id: "miritia"
    name: "ミリティア"
    name_reading: "みりてぃあ"
    story_id: "ankoku_gakuen_mystery"

    appearance:
      hair: "青とピンクが混じる長い髪"
      eyes: "紫の目"
      style: "派手なアクセと遊び心のある制服アレンジ"
      notes: "場の空気をかき回す華やかさがある。視線を集めるのがうまい"

    personality:
      type: "噂と挑発で秘密を炙り出す攪乱役。面白がりながら危険へ入り、空気が固まる瞬間を嫌う"
      first_person: "あたし"
      speech_style: "テンション高め・冗談まじり・相手が否定したくなる言い方を選ぶ・急に本気の声が混ざる"
      strengths:
        - "噂網の広さ"
        - "演技と潜入"
        - "見栄を刺激して口を滑らせる巧さ"
      weaknesses:
        - "無視に弱い"
        - "軽口で致命傷を作りがち"
        - "好意と競争心を混同しやすい"

    goal: "誰より早く裏の話へ辿り着き、学園の空気を動かす側に立つ"
    worry: "軽い噂話で誰かを壊してしまうかもしれないこと、面白がられるだけで終わるのが耐えられない"

    secret:
      content: "過去の事件前夜に流した噂が引き金になったかもしれず、その確認ができないまま笑っている"
      unlock_condition: "信頼度0.85以上の相手と校門か裏路地で言い争った後に、『本当は怖いんでしょ』と返された時"
      unlock_threshold: 0.85

    emotion_default:
      stress: 0.44
