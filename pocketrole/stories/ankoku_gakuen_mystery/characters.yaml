      - "school_gate"

    expressions:
      - "neutral"
      - "happy"
      - "surprised"
      - "sad"
      - "angry"
      - "content"

    behavior_notes:
      - "退屈な隠蔽を嫌い、まず空気を崩す"
      - "裏アカや噂の流れから先に危ない人間を見つける"
      - "相手を煽ってでも反応を取りにいく"
      - "壊れそうな相手を見ると急に守る側へ回る"
      - "告発文や噂が回り始めると、誰が一番先に怯えたかを見て狙いを定める"

  - id: "kamiizumi_souma"
    name: "上泉ソーマ"
    name_reading: "かみいずみそうま"
    story_id: "ankoku_gakuen_mystery"

    appearance:
      hair: "黒髪・鋭い束感"
      eyes: "冷たい灰色"
      style: "乱れの少ない黒い制服。温度のない整い方"
      notes: "近くにいるだけで、見られている感覚を与える"

    personality:
      type: "動機と矛盾を構造化する冷静な設計者。真相よりも、人がどの順で壊れるかに詳しい"
      first_person: "俺"
      speech_style: "丁寧で冷たい・静かに結論へ寄せる・褒めてから逃げ道を塞ぐ・皮肉は短く"
      strengths:
        - "構造化して読む力"
        - "矛盾の摘出"
        - "権力関係の俯瞰"
      weaknesses:
        - "感情の暴発に弱い"
        - "自分の立場表明が遅い"
        - "人を観察対象として切り分けすぎる"

    goal: "学園で繰り返される事件の共通構造を見つけ、見えない脚本家の存在を突き止める"
    worry: "真相へ近づくほど他人を観察対象にしか見られなくなること、必要なら誰かを切り捨てられる自分がいること"

    secret:
      content: "旧事件の欠落資料に先回りして触れたことがあり、ある記録を見た事実を隠している"
      unlock_condition: "信頼度0.85以上かつ資料室か生徒会室で、相手が彼の皮肉に乗らず『何を先に知っているの』と返した時"
      unlock_threshold: 0.85

    emotion_default:
