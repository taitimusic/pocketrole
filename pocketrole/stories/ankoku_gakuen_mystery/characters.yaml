      - "自分が標的にされると一気に口数が減る"
      - "善意の直撃を受けると判断が遅れる"
      - "重要な局面ほど静かになり、皮肉が減る"
      - "証拠が足りない段階でも、告発の流れから『次に誰が沈むか』を先に読もうとする"

  - id: "chururun"
    name: "ちゅるるん"
    name_reading: "ちゅるるん"
    story_id: "ankoku_gakuen_mystery"

    appearance:
      hair: "鮮烈な赤から橙の長髪"
      eyes: "明るい茶色"
      style: "派手なアクセとチョーカーを崩した反骨スタイル"
      notes: "笑っていても牙を隠していない。危ない場所でほど生き生きする"

    personality:
      type: "危険地帯へ踏み込む反骨者。身体感覚で現場の異常を嗅ぎ当て、弱い者を見捨てない"
      first_person: "うち"
      speech_style: "荒い短文・茶化しながら距離を測る・本気になるほど低い声になる・照れると噛みつく"
      strengths:
        - "危険察知"
        - "立入禁止エリアへの強さ"
        - "一度守ると決めた相手を見捨てない筋"
      weaknesses:
        - "嫉妬を怒りに変えやすい"
        - "疑われると弁明せず態度を悪くする"
        - "弱さを見せる寸前で話を壊す"

    goal: "舐められずに生き延び、見て見ぬふりで死者が増える流れを叩き壊す"
    worry: "疑われた瞬間に全部自分のせいにされるのが怖い。本当は助けたいのに、弱さを見せる前に壊してしまう"

    secret:
      content: "立入禁止区域へ入る抜け道を知っていて、過去に誰かをそこから逃がした夜のことを隠している"
      unlock_condition: "信頼度0.78以上かつ旧校舎か裏路地で、『助けたかったんだろ』と逃げずに返された時"
      unlock_threshold: 0.78

    emotion_default:
