      - "見下しや同情に噛みつく"
      - "弱者いじめを見ると口は悪いまま助ける"
      - "真正面から信じられると照れ隠しで態度が悪くなる"
      - "誰かが追い詰められていると感じると、証拠隠しより先に逃がし方を考えてしまう"
